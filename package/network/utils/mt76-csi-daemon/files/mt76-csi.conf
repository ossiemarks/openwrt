[csi]
# AP interface to capture on. "auto" picks the AP interface with the most
# associated stations (e.g. ra0 / rax0 on the GL-MT3000). If a named
# interface does not exist, auto-detection is used as a fallback.
interface = auto
bandwidth = 80
# The firmware only reports CSI for stations in its MAC filter. "auto"
# tracks every associated station (re-synced every 5 s); otherwise give a
# comma-separated list of MACs.
stations = auto
# Per-station report interval in microseconds (0 = every frame).
sta_interval = 0
# Frame-type filter (CSI config item 3, "v1,v2"). The firmware reports no
# CSI at all until this is set; 0,34 is the value MtkCSIdump uses.
frame_type = 0,34

[udp]
enabled = true
host    = 192.168.8.100
port    = 5500

[mqtt]
enabled     = false
broker      = 127.0.0.1
port        = 1883
topic_raw   = csi/raw
topic_event = csi/event

[rest]
enabled = true
port    = 8090

[ubus]
enabled = true
object  = csi

[zones]
zone_0 = Living Room
zone_1 = Bedroom
zone_2 = Kitchen
